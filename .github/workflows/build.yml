name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Web Folder
        run: |
          echo '{"appId":"com.totalcaresolution.app","appName":"TotalCare","webDir":"www"}' > capacitor.config.json
          mkdir -p www
          cp index.html www/ 2>/dev/null || echo "<h1>Total Care</h1>" > www/index.html
          cp -r *.js *.css *.json www/ 2>/dev/null || true
          ls -la www/

      - name: Build APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TotalCare-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
